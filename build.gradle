import org.gradle.internal.os.OperatingSystem;

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

sourceSets {
    api {
        compileClasspath = main.compileClasspath
        runtimeClasspath = main.runtimeClasspath
    }
    main {
        resources {
            srcDir 'src/generated/resources'
            srcDir generateModMetadata
        }
        java {
            srcDir 'src/api/java'
        }
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.api

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            def os = OperatingSystem.current();

            if (os.isLinux()) {
                def glfw = providers.systemProperty('net.industrybase.dev.linux.glfw');
                if (glfw.isPresent()) systemProperty 'org.lwjgl.glfw.libname', glfw.get();

                def nvidia = providers.systemProperty('net.industrybase.dev.linux.useNvidia').map({
                    Boolean.valueOf(it)
                }).orElse(false);
                if (nvidia.get()) {
                    environment '__NV_PRIME_RENDER_OFFLOAD', '1'
                    environment '__VK_LAYER_NV_optimus', 'NVIDIA_only'
                    environment '__GLX_VENDOR_LIBRARY_NAME', 'nvidia'
                    environment '__GL_THREADED_OPTIMIZATIONS', '0'
                }
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet sourceSets.api
            sourceSet sourceSets.main
        }
    }
}

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

var manifest_info = [
        "Specification-Title"   : mod_id,
        "Specification-Vendor"  : mod_authors,
        "Specification-Version" : "1",
        "Implementation-Title"  : project.name,
        "Implementation-Version": project.jar.archiveVersion,
        "Implementation-Vendor" : mod_authors
]

tasks.named('jar', Jar).configure {
    from sourceSets.api.output
    manifest {
        attributes(manifest_info)
    }
}

tasks.register('apiJar', Jar) {
    dependsOn apiClasses
    archiveClassifier = 'api'
    from sourceSets.api.output
    manifest {
        attributes(manifest_info)
    }
}

tasks.register('apiSourceJar', Jar) {
    dependsOn apiClasses
    archiveClassifier = 'api-source'
    from sourceSets.api.allSource
    manifest {
        attributes(manifest_info)
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    from sourceSets.api.allSource
    manifest {
        attributes(manifest_info)
    }
}

artifacts {
    archives sourcesJar
    archives apiJar
    archives apiSourceJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
//			from components.java
//			artifactId = archivesBaseName
            artifact jar
            artifact sourcesJar
            artifact apiJar
            artifact apiSourceJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
